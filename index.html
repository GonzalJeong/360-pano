<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360 Panorama</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #panorama { width: 100%; height: 100%; }
    #message {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 30px;
      background: #111;
      color: #fff;
      font-family: Arial, "Noto Sans KR", sans-serif;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="panorama"></div>
  <div id="message"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get("img");
    const requestedFolder = params.get("folder");

    // 기존 공유 링크(?img=wj-01.jpg)는 계속 wonji 폴더를 사용합니다.
    const folder = requestedFolder || "wonji";
    const message = document.getElementById("message");

    const validFile = file && /^[a-zA-Z0-9._-]+\.(jpg|jpeg|png)$/i.test(file);
    const validFolder = /^[a-zA-Z0-9._-]+$/.test(folder);

    if (!validFile || !validFolder) {
      message.style.display = "flex";
      message.innerHTML =
        "360° 파노라마 주소를 확인하세요.<br><br>" +
        "원지 예: ?img=wj-01.jpg<br>" +
        "다른 폴더 예: ?folder=omh&img=omh-01.JPG";
    } else {
      const imagePath = encodeURIComponent(folder) + "/" + encodeURIComponent(file);

      document.title = file.replace(/\.[^.]+$/, "") + " | 360 Panorama";

      pannellum.viewer("panorama", {
        type: "equirectangular",
        panorama: imagePath,
        autoLoad: true,
        autoRotate: -2,
        showControls: true,
        mouseZoom: true,
        draggable: true,
        compass: false,
        hfov: 100,
        minHfov: 30,
        maxHfov: 120
      });
    }
  </script>
</body>
</html>
