<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Gonzal 360 Panorama</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; font-family: Arial, sans-serif; }
    #panorama { width: 100vw; height: 100vh; }
    .title-box {
      position: fixed; top: 18px; left: 18px; z-index: 20;
      padding: 10px 14px; border-radius: 10px;
      color: #fff; background: rgba(0,0,0,.45); backdrop-filter: blur(4px);
      pointer-events: none;
    }
    .title-box .title { font-size: 18px; font-weight: 700; }
    .title-box .credit { margin-top: 4px; font-size: 12px; opacity: .82; }
    .hint {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 20;
      padding: 7px 11px; border-radius: 999px; color: #fff;
      background: rgba(0,0,0,.38); font-size: 12px; pointer-events: none;
      white-space: nowrap;
    }
    @media (max-width: 640px) {
      .title-box { top: 12px; left: 12px; padding: 8px 11px; }
      .title-box .title { font-size: 15px; }
      .hint { bottom: 12px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <div id="panorama"></div>
  <div class="title-box">
    <div class="title">360 Panorama</div>
    <div class="credit">© Gonzal JEONG</div>
  </div>
  <div class="hint">드래그하여 둘러보기 · 휠/핀치로 확대 · 전체화면 지원</div>

  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <script>
    const panoramaUrl = 'https://www.dropbox.com/scl/fi/rflruynye5a0s0fdlaib2/DJI_0089.JPG?rlkey=v1qc8g4o60vdv0zh046uashyf&raw=1';

    pannellum.viewer('panorama', {
      type: 'equirectangular',
      panorama: panoramaUrl,
      autoLoad: true,
      autoRotate: -2,
      autoRotateInactivityDelay: 5000,
      showControls: true,
      compass: false,
      hfov: 105,
      minHfov: 35,
      maxHfov: 120,
      mouseZoom: true,
      keyboardZoom: true,
      showFullscreenCtrl: true,
      showZoomCtrl: true,
      crossOrigin: 'anonymous'
    });
  </script>
</body>
</html>
