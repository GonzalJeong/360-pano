<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gonzal 360 Panorama</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center;
      background: #0b0f14; color: #f3f6f8;
      font-family: Arial, sans-serif;
    }
    .box {
      text-align: center; padding: 28px 32px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px; background: rgba(255,255,255,.04);
      max-width: 520px; margin: 20px;
    }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0; line-height: 1.6; opacity: .75; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Gonzal 360 Panorama</h1>
    <p>개별 파노라마 링크를 통해 접속해 주세요.</p>
  </div>
</body>
</html>
