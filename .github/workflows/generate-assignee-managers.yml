name: Generate assignee manager files

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'share/**'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate assignee manager files
        run: python scripts/generate_share_files.py

      - name: Commit generated files
        shell: bash
        run: |
          if git diff --quiet -- share; then
            echo "No generated file changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add share
          git commit -m "Auto-generate assignee manager files"
          git push
