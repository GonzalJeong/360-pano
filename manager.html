<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360 Panorama Manager</title>
  <style>
    :root {
      color-scheme: light;
      --bg:#f4f7fb; --card:#fff; --line:#dbe3ec; --text:#1f2937;
      --muted:#6b7280; --accent:#2563eb; --accent-dark:#1d4ed8; --soft:#eef4ff;
      --ok:#0f766e; --error:#b91c1c;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Noto Sans KR",sans-serif; }
    .wrap { width:min(980px,calc(100% - 28px)); margin:32px auto; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:0 8px 24px rgba(31,41,55,.06); overflow:hidden; }
    .header { padding:24px; border-bottom:1px solid var(--line); }
    h1 { margin:0 0 8px; font-size:24px; }
    .sub { margin:0; color:var(--muted); line-height:1.6; font-size:14px; }
    .toolbar { display:grid; grid-template-columns:auto 1fr auto; gap:10px; padding:16px 20px; border-bottom:1px solid var(--line); align-items:center; }
    input[type="text"] { width:100%; min-width:0; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:15px; outline:none; }
    input[type="text"]:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
    button,a.btn { border:0; border-radius:9px; padding:9px 12px; font-size:14px; font-weight:600; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; white-space:nowrap; }
    button.primary,a.primary { background:var(--accent); color:#fff; }
    button.primary:hover,a.primary:hover { background:var(--accent-dark); }
    button.secondary,a.secondary { background:var(--soft); color:var(--accent-dark); }
    .status { padding:12px 20px; color:var(--muted); font-size:13px; border-bottom:1px solid var(--line); }
    .status.ok { color:var(--ok); } .status.error { color:var(--error); }
    .row { display:grid; grid-template-columns:minmax(0,1fr) 110px 105px; gap:10px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
    .row:last-child { border-bottom:0; }
    .folder-row { grid-template-columns:minmax(0,1fr) 95px 125px; }
    .name { font-weight:650; overflow-wrap:anywhere; }
    .meta { margin-top:4px; color:var(--muted); font-size:12px; }
    .empty { padding:32px 20px; text-align:center; color:var(--muted); }
    .foot { margin-top:12px; color:var(--muted); font-size:12px; line-height:1.6; text-align:center; }
    .back { display:none; }
    @media (max-width:640px) {
      .wrap { margin:16px auto; width:min(100% - 16px,980px); }
      .header { padding:20px 16px; }
      .toolbar { grid-template-columns:auto 1fr; padding:14px 16px; }
      .toolbar #refreshBtn { grid-column:1 / -1; }
      .row { grid-template-columns:1fr 1fr; padding:14px 16px; }
      .row .info { grid-column:1 / -1; }
      .folder-row { grid-template-columns:1fr 1fr; }
      .folder-row .info { grid-column:1 / -1; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="header">
        <h1 id="title">360 Panorama Manager</h1>
        <p id="sub" class="sub">저장소의 파노라마 폴더를 자동으로 읽습니다.</p>
      </div>

      <div class="toolbar">
        <button id="backBtn" class="secondary back" type="button">← 폴더</button>
        <input id="search" type="text" placeholder="검색" autocomplete="off" />
        <button id="refreshBtn" class="secondary" type="button">새로고침</button>
      </div>

      <div id="status" class="status">목록을 불러오는 중...</div>
      <div id="list"></div>
    </section>

    <div class="foot">사진·폴더 변경 후 GitHub Desktop에서 Commit → Push 하세요. 새 프로젝트 폴더가 추가되면 담당자용 HTML은 GitHub Actions가 자동 생성합니다.</div>
  </main>

  <script>
    const OWNER = "GonzalJeong";
    const REPO = "360-pano";
    const BRANCH = "main";
    const DEFAULT_FOLDER = "wonji";
    const ROOT_API = `https://api.github.com/repos/${OWNER}/${REPO}/contents?ref=${BRANCH}`;
    const RESERVED_FOLDERS = new Set([".github", "share", "scripts"]);
    const PROJECT_LABELS = { wonji: "원지", omh: "외매화" };

    const params = new URLSearchParams(location.search);
    const activeFolder = params.get("folder");
    const assignedMode = params.get("assigned") === "1";
    const listEl = document.getElementById("list");
    const statusEl = document.getElementById("status");
    const searchEl = document.getElementById("search");
    const refreshBtn = document.getElementById("refreshBtn");
    const backBtn = document.getElementById("backBtn");
    const titleEl = document.getElementById("title");
    const subEl = document.getElementById("sub");

    let items = [];

    function projectLabel(folder) {
      return PROJECT_LABELS[folder.toLowerCase()] || folder;
    }

    function supportedImage(name) {
      return /^[a-zA-Z0-9._-]+\.(jpg|jpeg|png)$/i.test(name);
    }

    function safeFolder(name) {
      return /^[a-zA-Z0-9._-]+$/.test(name);
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
    }

    function managerUrl(folder) {
      const url = new URL("manager.html", location.href);
      url.searchParams.set("folder", folder);
      return url.toString();
    }

    function viewerUrl(folder, file) {
      const url = new URL("./", location.href);
      if (folder !== DEFAULT_FOLDER) url.searchParams.set("folder", folder);
      url.searchParams.set("img", file);
      return url.toString();
    }

    function assigneeFileUrl(folder) {
      return new URL(`share/${encodeURIComponent(folder)}_360관리.html`, location.href).toString();
    }

    async function copyText(text, button) {
      const original = button.textContent;
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const t = document.createElement("textarea");
        t.value = text; t.style.position="fixed"; t.style.opacity="0";
        document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove();
      }
      button.textContent = "복사됨";
      setTimeout(() => button.textContent = original, 1200);
    }

    function render() {
      const keyword = searchEl.value.trim().toLowerCase();
      const visible = items.filter(x => x.name.toLowerCase().includes(keyword) || projectLabel(x.name).toLowerCase().includes(keyword));
      listEl.innerHTML = "";

      if (!visible.length) {
        listEl.innerHTML = '<div class="empty">표시할 항목이 없습니다.</div>';
        return;
      }

      for (const item of visible) {
        const row = document.createElement("div");
        row.className = activeFolder ? "row" : "row folder-row";

        const info = document.createElement("div");
        info.className = "info";
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = activeFolder ? item.name : `${projectLabel(item.name)} (${item.name})`;
        info.appendChild(name);

        if (activeFolder) {
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = formatBytes(item.size);
          info.appendChild(meta);

          const open = document.createElement("a");
          open.className = "btn secondary";
          open.textContent = "360 보기";
          open.href = viewerUrl(activeFolder, item.name);
          open.target = "_blank";
          open.rel = "noopener";

          const copy = document.createElement("button");
          copy.className = "primary";
          copy.textContent = "링크 복사";
          copy.addEventListener("click", () => copyText(viewerUrl(activeFolder, item.name), copy));
          row.append(info, open, copy);
        } else {
          const openFolder = document.createElement("a");
          openFolder.className = "btn primary";
          openFolder.textContent = "열기";
          openFolder.href = managerUrl(item.name);

          const assignee = document.createElement("a");
          assignee.className = "btn secondary";
          assignee.textContent = "담당자 파일";
          assignee.href = assigneeFileUrl(item.name);
          assignee.download = `${projectLabel(item.name)}_360관리.html`;

          row.append(info, openFolder, assignee);
        }
        listEl.appendChild(row);
      }
    }

    async function fetchJson(url) {
      const res = await fetch(url, { headers:{"Accept":"application/vnd.github+json"}, cache:"no-store" });
      if (!res.ok) throw new Error(`GitHub API ${res.status}`);
      return res.json();
    }

    async function load() {
      refreshBtn.disabled = true;
      statusEl.className = "status";
      statusEl.textContent = "목록을 불러오는 중...";
      try {
        if (activeFolder) {
          if (!safeFolder(activeFolder) || RESERVED_FOLDERS.has(activeFolder)) throw new Error("Invalid folder");
          const label = projectLabel(activeFolder);
          titleEl.textContent = assignedMode ? `${label} 360 Panorama` : `360 Panorama Manager · ${label}`;
          subEl.textContent = assignedMode ? `${label} 담당자용 파노라마 관리 화면입니다.` : `${label} (${activeFolder}) 폴더의 파노라마 사진입니다.`;
          backBtn.style.display = assignedMode ? "none" : "inline-flex";
          searchEl.placeholder = "사진 파일명 검색";
          const api = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(activeFolder)}?ref=${BRANCH}`;
          const data = await fetchJson(api);
          items = data.filter(x => x.type === "file" && supportedImage(x.name))
                      .sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric:true,sensitivity:"base"}));
          statusEl.textContent = `파노라마 사진 ${items.length}개 · 갱신 완료`;
        } else {
          titleEl.textContent = "360 Panorama Manager";
          subEl.textContent = "전체 관리용 화면입니다. 폴더별 보기와 담당자용 HTML 파일 다운로드를 할 수 있습니다.";
          backBtn.style.display = "none";
          searchEl.placeholder = "폴더명 검색";
          const data = await fetchJson(ROOT_API);
          items = data.filter(x => x.type === "dir" && safeFolder(x.name) && !RESERVED_FOLDERS.has(x.name))
                      .sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric:true,sensitivity:"base"}));
          statusEl.textContent = `파노라마 폴더 ${items.length}개 · 갱신 완료`;
        }
        statusEl.className = "status ok";
        render();
      } catch (err) {
        items = [];
        listEl.innerHTML = "";
        statusEl.className = "status error";
        statusEl.textContent = "목록을 불러오지 못했습니다. 잠시 후 다시 새로고침하세요.";
      } finally {
        refreshBtn.disabled = false;
      }
    }

    searchEl.addEventListener("input", render);
    refreshBtn.addEventListener("click", load);
    backBtn.addEventListener("click", () => { location.href = "manager.html"; });

    load();
  </script>
</body>
</html>
