<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360 Panorama Manager</title>
  <style>
    :root{color-scheme:light;--bg:#f4f7fb;--card:#fff;--line:#dbe3ec;--text:#1f2937;--muted:#6b7280;--accent:#2563eb;--accent-dark:#1d4ed8;--soft:#eef4ff;--ok:#0f766e;--error:#b91c1c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Noto Sans KR",sans-serif}
    .wrap{width:min(980px,calc(100% - 28px));margin:32px auto}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(31,41,55,.06);overflow:hidden}
    .header{padding:24px;border-bottom:1px solid var(--line)}h1{margin:0 0 8px;font-size:24px}.sub{margin:0;color:var(--muted);line-height:1.6;font-size:14px}
    .toolbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);align-items:center}
    input[type="text"]{width:100%;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;outline:none}input[type="text"]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
    button,a.btn{border:0;border-radius:9px;padding:9px 12px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
    button.primary,a.primary{background:var(--accent);color:#fff}button.primary:hover,a.primary:hover{background:var(--accent-dark)}button.secondary,a.secondary{background:var(--soft);color:var(--accent-dark)}
    .status{padding:12px 20px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}.status.ok{color:var(--ok)}.status.error{color:var(--error)}
    .row{display:grid;grid-template-columns:minmax(0,1fr) 110px 115px;gap:10px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.folder-row{grid-template-columns:minmax(0,1fr) 90px 150px}
    .name{font-weight:650;overflow-wrap:anywhere}.meta{margin-top:4px;color:var(--muted);font-size:12px}.empty{padding:32px 20px;text-align:center;color:var(--muted)}.foot{margin-top:12px;color:var(--muted);font-size:12px;line-height:1.7;text-align:center}.back{display:none}
    @media(max-width:640px){.wrap{margin:16px auto;width:min(100% - 16px,980px)}.header{padding:20px 16px}.toolbar{grid-template-columns:auto 1fr;padding:14px 16px}.toolbar #refreshBtn{grid-column:1/-1}.row{grid-template-columns:1fr 1fr;padding:14px 16px}.row .info{grid-column:1/-1}.folder-row{grid-template-columns:1fr 1fr}.folder-row .info{grid-column:1/-1}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="header"><h1 id="title">360 Panorama Manager</h1><p id="sub" class="sub">전체 프로젝트를 관리하고 담당자용 HTML 파일을 바로 만들 수 있습니다.</p></div>
      <div class="toolbar"><button id="backBtn" class="secondary back" type="button">← 전체 프로젝트</button><input id="search" type="text" placeholder="검색" autocomplete="off" /><button id="refreshBtn" class="secondary" type="button">새로고침</button></div>
      <div id="status" class="status">목록을 불러오는 중...</div><div id="list"></div>
    </section>
    <div class="foot">평소에는 프로젝트 폴더의 사진만 관리하세요.<br>사진 변경 → GitHub Desktop Commit → Push → 이 페이지 새로고침 순서입니다.</div>
  </main>
<script>
const OWNER="GonzalJeong",REPO="360-pano",BRANCH="main",BASE_SITE="https://gonzaljeong.github.io/360-pano/",DEFAULT_FOLDER="wonji";
const ROOT_API=`https://api.github.com/repos/${OWNER}/${REPO}/contents?ref=${BRANCH}`;
const RESERVED_FOLDERS=new Set([".github","share","scripts"]),PROJECT_LABELS={wonji:"원지",omh:"외매화"};
const params=new URLSearchParams(location.search),activeFolder=params.get("folder");
const listEl=document.getElementById("list"),statusEl=document.getElementById("status"),searchEl=document.getElementById("search"),refreshBtn=document.getElementById("refreshBtn"),backBtn=document.getElementById("backBtn"),titleEl=document.getElementById("title"),subEl=document.getElementById("sub");
let items=[];
function projectLabel(folder){return PROJECT_LABELS[folder.toLowerCase()]||folder}
function supportedImage(name){return /^[a-zA-Z0-9._-]+\.(jpg|jpeg|png)$/i.test(name)}
function safeFolder(name){return /^[a-zA-Z0-9._-]+$/.test(name)}
function formatBytes(bytes){if(bytes<1024)return `${bytes} B`;if(bytes<1048576)return `${(bytes/1024).toFixed(1)} KB`;return `${(bytes/1048576).toFixed(2)} MB`}
function managerUrl(folder){const url=new URL("manager.html",location.href);url.searchParams.set("folder",folder);return url.toString()}
function viewerUrl(folder,file){const url=new URL(BASE_SITE);if(folder!==DEFAULT_FOLDER)url.searchParams.set("folder",folder);url.searchParams.set("img",file);return url.toString()}
async function copyText(text,button){const original=button.textContent;try{await navigator.clipboard.writeText(text)}catch{const t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}button.textContent="복사됨";setTimeout(()=>button.textContent=original,1200)}

function buildAssigneeHtml(folder){
  const label=projectLabel(folder),folderJson=JSON.stringify(folder),labelJson=JSON.stringify(label);
  return `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>${label} 360 Panorama</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--line:#dbe3ec;--text:#1f2937;--muted:#6b7280;--accent:#2563eb;--soft:#eef4ff;--ok:#0f766e;--error:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Noto Sans KR",sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:32px auto}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(31,41,55,.06)}.header{padding:24px;border-bottom:1px solid var(--line)}h1{margin:0 0 8px;font-size:24px}.sub{margin:0;color:var(--muted);font-size:14px;line-height:1.6}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}button,a.btn{border:0;border-radius:9px;padding:9px 12px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}.secondary{background:var(--soft);color:#1d4ed8}.status{color:var(--muted);font-size:13px}.status.ok{color:var(--ok)}.status.error{color:var(--error)}.row{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.name{font-weight:650}.meta{margin-top:4px;color:var(--muted);font-size:12px}.empty{padding:32px 20px;text-align:center;color:var(--muted)}@media(max-width:640px){.wrap{margin:16px auto;width:min(100% - 16px,900px)}.row{grid-template-columns:minmax(0,1fr) 100px}}
</style>
</head>
<body><main class="wrap"><section class="card"><div class="header"><h1 id="title"></h1><p class="sub">담당자용 360° 파노라마 목록입니다. 최신 사진 목록을 인터넷에서 자동으로 불러옵니다.</p></div><div class="bar"><div id="status" class="status">목록을 불러오는 중...</div><button id="refresh" class="secondary" type="button">새로고침</button></div><div id="list"></div></section></main>
<script>
const OWNER="GonzalJeong",REPO="360-pano",BRANCH="main",BASE="https://gonzaljeong.github.io/360-pano/",FOLDER=${folderJson},LABEL=${labelJson};
const list=document.getElementById("list"),status=document.getElementById("status"),refresh=document.getElementById("refresh");document.getElementById("title").textContent=LABEL+" 360 Panorama";let items=[];
function ok(n){return /^[a-zA-Z0-9._-]+\\.(jpg|jpeg|png)$/i.test(n)}function bytes(n){return n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(2)+" MB"}function view(name){const u=new URL(BASE);if(FOLDER!=="wonji")u.searchParams.set("folder",FOLDER);u.searchParams.set("img",name);return u.toString()}
function render(){list.innerHTML="";if(!items.length){list.innerHTML='<div class="empty">표시할 사진이 없습니다.</div>';return}for(const x of items){const r=document.createElement("div");r.className="row";const i=document.createElement("div");i.className="info";i.innerHTML='<div class="name"></div><div class="meta"></div>';i.querySelector(".name").textContent=x.name;i.querySelector(".meta").textContent=bytes(x.size);const a=document.createElement("a");a.className="btn secondary";a.textContent="360 보기";a.href=view(x.name);a.target="_blank";a.rel="noopener";r.append(i,a);list.appendChild(r)}}
async function load(){refresh.disabled=true;status.className="status";status.textContent="목록을 불러오는 중...";try{const api="https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+encodeURIComponent(FOLDER)+"?ref="+BRANCH;const res=await fetch(api,{headers:{Accept:"application/vnd.github+json"},cache:"no-store"});if(!res.ok)throw new Error();const data=await res.json();items=data.filter(x=>x.type==="file"&&ok(x.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:"base"}));status.className="status ok";status.textContent="파노라마 사진 "+items.length+"개 · 갱신 완료";render()}catch{items=[];list.innerHTML="";status.className="status error";status.textContent="목록을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요."}finally{refresh.disabled=false}}
refresh.addEventListener("click",load);load();
<\/script></body></html>`;
}

function downloadAssigneeFile(folder){const label=projectLabel(folder),blob=new Blob([buildAssigneeHtml(folder)],{type:"text/html;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`${label}_360관리.html`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function render(){
  const keyword=searchEl.value.trim().toLowerCase(),visible=items.filter(x=>x.name.toLowerCase().includes(keyword)||projectLabel(x.name).toLowerCase().includes(keyword));listEl.innerHTML="";
  if(!visible.length){listEl.innerHTML='<div class="empty">표시할 항목이 없습니다.</div>';return}
  for(const item of visible){
    const row=document.createElement("div");row.className=activeFolder?"row":"row folder-row";
    const info=document.createElement("div");info.className="info";const name=document.createElement("div");name.className="name";name.textContent=activeFolder?item.name:`${projectLabel(item.name)} (${item.name})`;info.appendChild(name);
    if(activeFolder){const meta=document.createElement("div");meta.className="meta";meta.textContent=formatBytes(item.size);info.appendChild(meta);const open=document.createElement("a");open.className="btn secondary";open.textContent="360 보기";open.href=viewerUrl(activeFolder,item.name);open.target="_blank";open.rel="noopener";const copy=document.createElement("button");copy.className="primary";copy.textContent="링크 복사";copy.addEventListener("click",()=>copyText(viewerUrl(activeFolder,item.name),copy));row.append(info,open,copy)}
    else{const openFolder=document.createElement("a");openFolder.className="btn primary";openFolder.textContent="열기";openFolder.href=managerUrl(item.name);const download=document.createElement("button");download.className="secondary";download.textContent="담당자 파일 받기";download.addEventListener("click",()=>downloadAssigneeFile(item.name));row.append(info,openFolder,download)}
    listEl.appendChild(row)
  }
}
async function fetchJson(url){const res=await fetch(url,{headers:{Accept:"application/vnd.github+json"},cache:"no-store"});if(!res.ok)throw new Error(`GitHub API ${res.status}`);return res.json()}
async function load(){refreshBtn.disabled=true;statusEl.className="status";statusEl.textContent="목록을 불러오는 중...";try{if(activeFolder){if(!safeFolder(activeFolder)||RESERVED_FOLDERS.has(activeFolder))throw new Error("Invalid folder");const label=projectLabel(activeFolder);titleEl.textContent=`360 Panorama Manager · ${label}`;subEl.textContent=`${label} (${activeFolder}) 폴더의 파노라마 사진입니다.`;backBtn.style.display="inline-flex";searchEl.placeholder="사진 파일명 검색";const api=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(activeFolder)}?ref=${BRANCH}`;const data=await fetchJson(api);items=data.filter(x=>x.type==="file"&&supportedImage(x.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:"base"}));statusEl.textContent=`파노라마 사진 ${items.length}개 · 갱신 완료`}else{titleEl.textContent="360 Panorama Manager";subEl.textContent="전체 관리용 화면입니다. 프로젝트별 보기와 담당자용 HTML 파일 생성을 할 수 있습니다.";backBtn.style.display="none";searchEl.placeholder="프로젝트 폴더명 검색";const data=await fetchJson(ROOT_API);items=data.filter(x=>x.type==="dir"&&safeFolder(x.name)&&!RESERVED_FOLDERS.has(x.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:"base"}));statusEl.textContent=`파노라마 프로젝트 ${items.length}개 · 갱신 완료`}statusEl.className="status ok";render()}catch(err){items=[];listEl.innerHTML="";statusEl.className="status error";statusEl.textContent="목록을 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 새로고침하세요."}finally{refreshBtn.disabled=false}}
searchEl.addEventListener("input",render);refreshBtn.addEventListener("click",load);backBtn.addEventListener("click",()=>{location.href="manager.html"});load();
</script>
</body>
</html>
